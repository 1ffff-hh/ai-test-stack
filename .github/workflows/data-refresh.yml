name: data-refresh

on:
  schedule:
    # 每周一 09:10（北京时间）跑一次；GitHub cron 用 UTC
    - cron: '10 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 门禁要开真浏览器。没有这一步，下面 a11y / verify 会因为找不到 playwright 直接失败。
      - name: 装 Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 抓取 RSS 与价格指纹
        run: node scripts/refresh.js || true

      # 价格页变了就开一条 issue，把待办推到眼前；没变化就什么都不做。
      # 已有同名 open issue 时改为追加评论，避免每周刷屏。
      - name: 价格页有变化就开 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(node -e "const p=require('./data/_pending.json');console.log((p.items||[]).filter(x=>x.status==='pending').length)" 2>/dev/null || echo 0)
          if [ "$N" = "0" ]; then echo "没有待处置的价格变更"; exit 0; fi
          TITLE="数据核验待办：${N} 个价格页有变化"
          BODY=$(node scripts/data-triage.js)
          NUM=$(gh issue list --state open --search "数据核验待办 in:title" --json number -q '.[0].number' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
      - name: 重新构建并跑门禁
        run: |
          node build.js
          node scripts/check-pii.js --self-test
          node scripts/check-pii.js
          node scripts/a11y-audit.js
          node scripts/verify.js > verify.json || (cat verify.json && exit 1)
        env:
          PW_CHANNEL: chromium
      - name: 有变化才提交
        run: |
          git config user.name "ai-test-stack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news-auto.json data/_price-snapshots.json data/_refresh-report.json data/_data-audit.json index.html
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: weekly refresh ($(date -u +%F))"
            git push
          fi
