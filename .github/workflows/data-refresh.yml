name: data-refresh

on:
  schedule:
    # 每周一 09:10（北京时间）跑一次；GitHub cron 用 UTC
    - cron: '10 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 门禁要开真浏览器。没有这一步，下面 a11y / verify 会因为找不到 playwright 直接失败。
      - name: 装 Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 抓取 RSS 与价格指纹
        run: node scripts/refresh.js || true
      - name: 重新构建并跑门禁
        run: |
          node build.js
          node scripts/check-pii.js --self-test
          node scripts/check-pii.js
          node scripts/a11y-audit.js
          node scripts/verify.js > verify.json || (cat verify.json && exit 1)
        env:
          PW_CHANNEL: chromium
      - name: 有变化才提交
        run: |
          git config user.name "ai-test-stack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news-auto.json data/_price-snapshots.json data/_refresh-report.json index.html
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: weekly refresh ($(date -u +%F))"
            git push
          fi
