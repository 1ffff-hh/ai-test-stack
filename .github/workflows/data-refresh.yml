name: data-refresh

on:
  schedule:
    # 每周一 09:10（北京时间）跑一次；GitHub cron 用 UTC
    - cron: '10 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # 门禁要开真浏览器。没有这一步，下面 a11y / verify 会因为找不到 playwright 直接失败。
      - name: 装 Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 抓取 RSS 与价格指纹
        run: node scripts/refresh.js || true

      # 社区资源库的星数 / 最近提交 / 许可证会变，手抄一定过期。
      # 这一步只写 community-stats.json，不碰 community.json 里人写的判断。
      - name: 刷新社区资源的星数与活跃度
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-community.js || true

      # 指纹只说「页面变了」；这一步按规则把价格抽出来，能直接说出「变成多少」。
      # 解析失败也算结果——宁可报错，也不要一个看起来合理的错数。
      - name: 按规则解析官网价格
        run: node scripts/parse-pricing.js --fixtures || true

      # 价格页变了就开一条 issue，把待办推到眼前；没变化就什么都不做。
      # 已有同名 open issue 时改为追加评论，避免每周刷屏。
      - name: 价格页有变化就开 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(node -e "const p=require('./data/_pending.json');const c=require('./data/_price-check.json');const a=(p.items||[]).filter(x=>x.status==='pending').length;const b=(c.items||[]).filter(x=>['mismatch','parse-fail','fetch-fail','no-fixture'].includes(x.status)).length;console.log(a+b)" 2>/dev/null || echo 0)
          if [ "$N" = "0" ]; then echo "没有待处置的价格变更"; exit 0; fi
          TITLE="数据核验待办：${N} 项需要确认"
          BODY=$(node scripts/data-triage.js)
          NUM=$(gh issue list --state open --search "数据核验待办 in:title" --json number -q '.[0].number' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
      - name: 重新构建并跑门禁
        run: |
          node build.js
          node scripts/check-pii.js --self-test
          node scripts/check-pii.js
          node scripts/a11y-audit.js
          node scripts/verify.js > verify.json || (cat verify.json && exit 1)
        env:
          PW_CHANNEL: chromium
      - name: 有变化才提交
        run: |
          git config user.name "ai-test-stack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news-auto.json data/_price-snapshots.json data/_refresh-report.json data/_data-audit.json data/fixtures index.html
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: weekly refresh ($(date -u +%F))"
            git push
          fi
